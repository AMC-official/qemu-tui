version: 2

project_name: qemu-tui

builds:
  - id: qemu-tui
    main: ./cmd/qemu-tui
    binary: qemu-tui

    env:
      - CGO_ENABLED=0

    goos:
      - linux
      - windows
      - darwin
      - freebsd
      - openbsd
      - netbsd
      - dragonfly

    goarch:
      - amd64
      - 386
      - arm64
      - riscv64

    ignore:
      - goos: darwin
        goarch: 386
      - goos: darwin
        goarch: riscv64
      - goos: windows
        goarch: riscv64
      - goos: freebsd
        goarch: riscv64
      - goos: netbsd
        goarch: riscv64
      - goos: dragonfly
        goarch: 386
      - goos: dragonfly
        goarch: arm64
      - goos: dragonfly
        goarch: riscv64

    goamd64:
      - v1
    goriscv64:
      - rva20u64

    flags:
      - -trimpath

    ldflags:
      - -s -w

    mod_timestamp: '{{ .CommitTimestamp }}'

archives:
  - id: qemu-tui-archive
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    name_template: '{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}'
    files:
      - LICENSE*
      - README*

checksum:
  name_template: '{{ .ProjectName }}_{{ .Version }}_checksums.txt'
  algorithm: sha256

changelog:
  sort: asc
